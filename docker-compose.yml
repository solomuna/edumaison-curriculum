services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: curriculum-app:latest
    container_name: curriculum-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./:/var/www/html
    networks:
      - curriculum
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: curriculum-nginx
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/curriculum.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - curriculum
      - proxy
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: curriculum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - curriculum-postgres:/var/lib/postgresql/data
    networks:
      - curriculum
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: curriculum-redis
    restart: unless-stopped
    volumes:
      - curriculum-redis:/data
    networks:
      - curriculum

  queue:
    image: curriculum-app:latest
    container_name: curriculum-queue
    restart: unless-stopped
    user: "82:82"
    env_file: .env
    command: php artisan queue:work --tries=3 --timeout=120 --sleep=3
    volumes:
      - ./:/var/www/html
    networks:
      - curriculum
    depends_on:
      - app
      - postgres
      - redis

  cron:
    image: curriculum-app:latest
    container_name: curriculum-cron
    restart: unless-stopped
    user: "82:82"
    env_file: .env
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    volumes:
      - ./:/var/www/html
    networks:
      - curriculum
    depends_on:
      - app
      - postgres

networks:
  curriculum:
    # name explicite (sans préfixe projet compose) pour que d'autres stacks
    # puissent rejoindre ce network via `external: true` + `name: curriculum`
    # (cf edumaison-api qui partage la DB `edumaison` hébergée ici).
    name: curriculum
    driver: bridge
  proxy:
    external: true

volumes:
  curriculum-postgres:
  curriculum-redis:
